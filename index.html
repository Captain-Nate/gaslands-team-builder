<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unofficial team builder for Gaslands third-edition playtest rules: vehicles, weapons, upgrades, drivers, perks and sponsors with live legality checks.">
<meta name="theme-color" content="#121416">
<title>Gaslands Team Builder</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a garage bay. One sticky "pit board" (cans, vehicles, sponsor) over a grid of dashboard cards, one per vehicle. */
:root{
  --bg:#e7e9ec;        /* galvanized steel */
  --panel:#f6f7f8;
  --panel-2:#eceef1;
  --ink:#1a1e23;
  --muted:#5b6470;
  --line:#c9ced5;
  --accent:#d9480f;    /* traffic-cone orange */
  --accent-ink:#ffffff;
  --accent-soft:#fbe3d6;
  --good:#2b8a3e; --good-soft:#dcefe0;
  --bad:#c92a2a;  --bad-soft:#f8dcdc;
  --warn:#b7791f; --warn-soft:#f6ead2;
  --display:"Saira Stencil One", "Arial Black", Impact, sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121416; --panel:#1b1f23; --panel-2:#22272c; --ink:#e9ecef; --muted:#9aa4af; --line:#333a42;
  --accent:#ff7a2e; --accent-ink:#16181a; --accent-soft:#3a2416;
  --good:#51cf66; --good-soft:#1c3323; --bad:#ff6b6b; --bad-soft:#3b1d1d; --warn:#f2b84b; --warn-soft:#3a2f17;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121416; --panel:#1b1f23; --panel-2:#22272c; --ink:#e9ecef; --muted:#9aa4af; --line:#333a42;
  --accent:#ff7a2e; --accent-ink:#16181a; --accent-soft:#3a2416;
  --good:#51cf66; --good-soft:#1c3323; --bad:#ff6b6b; --bad-soft:#3b1d1d; --warn:#f2b84b; --warn-soft:#3a2f17;
  color-scheme:dark }
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;padding-block:18px 10px}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);letter-spacing:.02em;line-height:1}
.mast h1 span{color:var(--accent)}
.mast .tag{color:var(--muted);font-size:13px;flex:1 1 220px}
.chip-ex{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:2px 7px}

/* pit board */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.board-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
.team-name{flex:2 1 220px}
.team-name input{width:100%;font-weight:600}
.budget{flex:0 0 auto}
.bud-row{display:flex;gap:6px}
.bud-row input{width:88px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;font-weight:600;font-variant-numeric:tabular-nums}
.gauge{flex:3 1 280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--cond);font-variant-numeric:tabular-nums}
.gauge-top b{font-size:22px;font-weight:700}
.gauge-top .sub{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
.bar.over i{background:var(--bad)}
.cans-cells{display:flex;gap:2px;flex-wrap:wrap}
.status-pill{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.ok{background:var(--good-soft);color:var(--good)} .no{background:var(--bad-soft);color:var(--bad)} .meh{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;min-height:40px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:14px}
.btn.danger{color:var(--bad)}

/* issues */
.issues{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.issue{font-size:14px;border-radius:6px;padding:5px 10px;background:var(--bad-soft);color:var(--bad)}
.issue.w{background:var(--warn-soft);color:var(--warn)}

/* main grid */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:960px){main{grid-template-columns:minmax(0,1fr)}}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:16px}

/* dashboard card */
.car{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.car-head{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.car-head .num{font-family:var(--display);font-size:26px;color:var(--accent);line-height:1}
.car-head select{flex:1 1 auto;min-width:0;font-weight:700}
.car-head .cost{font-family:var(--cond);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.car-head .cost small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.car-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{text-align:center;padding:6px 2px;border-right:1px solid var(--line);background:var(--panel)}
.stat:last-child{border-right:0}
.stat .k{font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--cond);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v.up{color:var(--good)} .stat .v.down{color:var(--bad)}
.gear-track{display:flex;gap:3px;justify-content:center;margin-top:3px}
.gear-track span{width:7px;height:7px;border-radius:2px;background:var(--line)}
.gear-track span.on{background:var(--accent)}
.hull{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.hull span{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:3px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.slots{display:flex;gap:3px;align-items:center}
.slots span{width:16px;height:10px;border-radius:2px;border:1.5px solid var(--muted)}
.slots span.used{background:var(--ink);border-color:var(--ink)}
.slots span.over{background:var(--bad);border-color:var(--bad)}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rule{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.03em;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel);cursor:help}
.rule.sp{border-color:var(--accent);color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.sec-h h3{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.sec-h .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.driver-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.driver-grid{grid-template-columns:1fr}}
.driver-grid select,.driver-grid input{width:100%}
.note{font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center;background:var(--panel-2);border-radius:8px;padding:7px 8px 7px 10px}
.item .nm{font-weight:600;min-width:0}
.item .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.35}
.item .pr{font-family:var(--cond);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.item select{min-height:32px;padding:3px 6px;font-size:13px}
.item .x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.item .x:hover{color:var(--bad);background:var(--bad-soft)}
.item .ctl{display:flex;gap:6px;align-items:center;grid-column:1 / -1}
.item.bad{outline:1.5px solid var(--bad)}
.adder{display:flex;gap:6px}
.adder select{flex:1 1 auto;min-width:0}
.perks{display:flex;flex-direction:column;gap:5px}
.perk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.perk:hover{background:var(--panel-2)}
.perk.on{background:var(--accent-soft);border-color:var(--accent)}
.perk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}
.perk .pn{font-weight:600}
.perk .pn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.35}
.perk .pc{font-family:var(--cond);font-weight:700;white-space:nowrap}
.perk-class{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:4px}
.car-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.car .issues{margin-top:0}
.add-car{border:2px dashed var(--line);border-radius:14px;background:transparent;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;color:var(--muted)}
.add-car select{min-width:220px;max-width:100%}

/* side panel */
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;margin-bottom:8px}
.sponsor{border-top:1px solid var(--line);padding-block:8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start}
.sponsor:first-of-type{border-top:0}
.sponsor input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px}
.sponsor .sn{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sponsor .sr{font-size:13px;color:var(--muted);grid-column:2}
.sponsor .sp{font-size:13px;grid-column:2}
.sponsor .sp b{color:var(--accent)}
.sponsor.dim .sn{color:var(--muted)}
.save-list{display:flex;flex-direction:column;gap:6px}
.save-row{display:flex;gap:6px;align-items:center;justify-content:space-between;background:var(--panel-2);border-radius:8px;padding:6px 8px}
.save-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
textarea{width:100%;min-height:70px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:20}
details.glossary summary{cursor:pointer;font-weight:700}
.gl{font-size:13.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:8px}
.gl b{font-family:var(--cond);letter-spacing:.03em;white-space:nowrap}
.foot{margin-top:28px;color:var(--muted);font-size:12.5px;max-width:70ch}
@media (max-width:700px){.board{position:static}}
.home-link{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit}
.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav .btn[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:52px;padding:12px 20px;font-size:17px}
/* home */
.home{display:flex;flex-direction:column;gap:16px;max-width:760px;margin-top:8px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero-h{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.5vw,40px);line-height:1.05}
.hero-p{margin:0;max-width:62ch;color:var(--muted)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.confirm{background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.confirm p{margin:0 0 8px}
.resume-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.how b{color:var(--ink);margin-right:6px}
/* wizard */
.wiz{max-width:900px;margin-top:8px;display:flex;flex-direction:column;gap:14px}
.wiz-head{display:flex;flex-direction:column;gap:8px}
.wiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wiz-title{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wiz-q{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.5vw,32px);line-height:1.1}
.wiz-body{display:flex;flex-direction:column;gap:12px}
.wiz-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.wiz-fields input[type=text],.wiz-fields select{width:100%}
.wiz-stat{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--cond);font-size:16px;font-variant-numeric:tabular-nums}
.wiz-stat b{font-size:20px}
.wiz-stat .neg{color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.choice:hover{border-color:var(--ink)}
.choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.ch-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ch-top b{font-size:16px}
.ch-cost{font-family:var(--cond);font-weight:700;white-space:nowrap;color:var(--muted)}
.ch-stats{font-family:var(--cond);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-rules{font-size:13px;color:var(--muted);line-height:1.35}
.ch-badge{align-self:flex-start;font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px}
.addgroup{display:flex;flex-direction:column;gap:6px}
.addrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.addrow:hover{border-color:var(--ink)}
.addrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.addrow:disabled{opacity:.45;cursor:not-allowed}
.addrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.ar-p{font-family:var(--cond);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ar-why{grid-column:1 / -1;font-size:12.5px;color:var(--bad)}
.ar-why.warn{color:var(--warn)}
.wiz-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.wiz-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.wiz-side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.wiz-sum-mobile{display:none}
@media (max-width:900px){.wiz-grid{grid-template-columns:minmax(0,1fr)}.wiz-side{display:none}.wiz-sum-mobile{display:block}}
.wiz-sum-mobile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wiz-sum-mobile summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none}
.wiz-sum-mobile summary::-webkit-details-marker{display:none}
.wiz-sum-mobile summary::after{content:"Show";font-family:var(--cond);font-weight:600;color:var(--accent)}
.wiz-sum-mobile[open] summary::after{content:"Hide"}
.sum{display:flex;flex-direction:column;gap:10px;font-size:14px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--cond);font-variant-numeric:tabular-nums}
.sum-top b{font-size:20px}
.sum-car{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;background:var(--panel)}
.sum-car.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.sum-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum-h b{font-size:15px}
.sum-h span{font-family:var(--cond);font-weight:700;white-space:nowrap}
.sum-stats{font-family:var(--cond);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;font-size:13.5px;line-height:1.35}
.sum-row .k{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:1px}
.sum-row ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.sum-row li{display:flex;justify-content:space-between;gap:6px}
.sum-row li span:last-child{font-family:var(--cond);color:var(--muted);white-space:nowrap}
.sum-row .none{color:var(--muted)}
.sum-flag{font-size:12.5px;color:var(--warn)}
.sum-flag.bad{color:var(--bad)}
.sum-edit{all:unset;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:13px;color:var(--accent)}
.sum-edit:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* play mode */
.play{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.play-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:6px}
.counter b{font-family:var(--cond);font-size:26px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.cbtn{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:22px;font-weight:700}
.cbtn:hover{border-color:var(--ink)}
.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play-cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px}
.dash{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dash.wrecked{border-color:var(--bad)}
.dash-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dash-h b{font-family:var(--display);font-weight:400;font-size:22px}
.dash-sec{display:flex;flex-direction:column;gap:6px}
.dash-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gears{display:flex;gap:6px;flex-wrap:wrap}
.gbtn{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;font-family:var(--cond);font-weight:700;font-size:20px;background:var(--panel)}
.gbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gbtn:disabled{opacity:.3;cursor:not-allowed}
.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hz{display:flex;align-items:center;gap:8px;border-radius:12px;padding:4px 6px;border:1.5px solid var(--line)}
.hz b{font-family:var(--cond);font-size:28px;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.hz.mid{border-color:var(--warn);background:var(--warn-soft)}
.hz.hi{border-color:var(--bad);background:var(--bad-soft)}
.hand{font-family:var(--cond);font-size:16px}
.hand b{font-size:28px;margin-right:4px}
.hullgrid{display:flex;flex-wrap:wrap;gap:5px}
.hb{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-family:var(--cond);font-size:12px;color:var(--muted)}
.hb.hit{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ammo-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ammo-boxes{display:flex;gap:6px}
.ab{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700}
.ab.used{background:var(--muted);border-color:var(--muted);color:var(--panel)}
.ab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.firebtn{all:unset;box-sizing:border-box;cursor:pointer;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700}
.firebtn.on{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.firebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ref{font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.ref b{font-weight:600}
details.refbox summary{cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.wiz-nav{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4}
.wiz-count{font-family:var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.rev-cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.rev-car{display:flex;flex-direction:column;gap:6px}
.rev-h{display:flex;justify-content:space-between;gap:8px;font-size:17px}
.rev-h span{font-family:var(--cond);font-weight:700}
.rev-total{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--cond);font-size:18px}
.rev-total b{font-size:26px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============================== RULES ENGINE ============================== */
function evalCar(v, teamCtx){
  const b=VEHICLES[v.type];
  const st={mg:b[0],hd:b[1],cr:b[2],wt:b[3],ar:b[4],hl:b[5],sl:b[6]};
  const base={...st};
  const rules=[...b[9]];
  const issues=[];
  const isVan = v.type==="Van", isTank=v.type==="Tank";
  // upgrades: stat mods
  v.upgrades.forEach(u=>{ const d=U[u.k]; if(!d) return; if(d.mod) for(const k in d.mod) st[k]+=d.mod[k]; if(d.trailer){ st.sl+=d.trailer; } });
  v.perks.forEach(pid=>{ const p=PERK_BY_ID[pid]; if(p&&p.mod) for(const k in p.mod) st[k]+=p.mod[k]; });
  if(st.mg>6) st.mg=6;
  const trailer=v.upgrades.map(u=>U[u.k]).find(d=>d&&d.trailer);
  if(trailer){ if(!rules.includes("Articulated")) rules.push("Articulated"); if(trailer.trailer>=2&&!rules.includes("Hefty")) rules.push("Hefty"); if(trailer.trailer>=3&&!rules.includes("Sluggish")) rules.push("Sluggish"); }
  // costs + slots
  let cost=b[7]; let slotsUsed=0;
  const wCost=w=>W[w.k]?W[w.k].cost:0;
  v.weapons.forEach(w=>{ const d=W[w.k]; if(!d) return; cost+=d.cost; slotsUsed+=d.slots; });
  // upgrade slot needs, Van reduces up to 3 upgrades by 1
  const upSlots=v.upgrades.map(u=>{ const d=U[u.k]; if(!d) return 0; if(d.turret&&isTank) return 0; return d.slots; });
  if(isVan){ const idx=upSlots.map((s,i)=>[s,i]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,3); idx.forEach(([s,i])=>upSlots[i]=s-1); }
  v.upgrades.forEach((u,i)=>{ const d=U[u.k]; if(!d) return; slotsUsed+=upSlots[i];
    if(d.turret){ const tw=v.weapons.find(w=>w.id===u.target); cost+=2+(tw?wCost(tw):0); if(!tw) issues.push(["Turret Mount needs a weapon to mount.","w"]); else if((W[tw.k].tags||[]).includes("360")||W[tw.k].cat==="Dropped") issues.push([`Turret Mount on ${tw.k} does nothing: it isn't a facing weapon.`,"w"]); }
    else cost+=d.cost; });
  v.perks.forEach(pid=>{ const p=PERK_BY_ID[pid]; if(p) cost+=p.cost; });
  if(slotsUsed>st.sl) issues.push([`Uses ${slotsUsed} build slots but has ${st.sl}.`]);
  // per-vehicle restrictions
  const seen={};
  v.upgrades.forEach(u=>{ const d=U[u.k]; if(!d) return; if(d.cat==="Common"){ seen[u.k]=(seen[u.k]||0)+1; if(seen[u.k]===2) issues.push([`${u.k} can only be fitted once per vehicle.`]); } });
  const seenD={};
  v.weapons.forEach(w=>{ const d=W[w.k]; if(d&&d.cat==="Dropped"){ seenD[w.k]=(seenD[w.k]||0)+1; if(seenD[w.k]===2) issues.push([`${w.k} can only be fitted once per vehicle.`]); } });
  const trailers=v.upgrades.filter(u=>U[u.k]&&U[u.k].trailer);
  if(trailers.length>1) issues.push(["Only one trailer per vehicle."]);
  trailers.forEach(u=>{ const d=U[u.k]; if(base.wt+(v.upgrades.some(x=>x.k==="Heavy Frame")?1:0)<d.weightMin) issues.push([`${u.k} needs Weight ${d.weightMin}+.`]); if(rules.includes("Airborne")) issues.push(["Airborne vehicles can't tow trailers."]); });
  const elecOK = isVan || teamCtx.spark;
  const hasElec=[...v.weapons.map(w=>W[w.k]),...v.upgrades.map(u=>U[u.k])].some(d=>d&&(d.tags||[]).includes("Electrical"));
  if(hasElec && !elecOK) issues.push(["Electrical gear needs a Spark driver on the team (or a Van)."]);
  // perks must be unlocked
  const unlocked=new Set(); if(v.arch&&ARCH[v.arch]) unlocked.add(ARCH[v.arch][0]); if(v.named&&v.second) unlocked.add(v.second);
  v.perks.forEach(pid=>{ const p=PERK_BY_ID[pid]; if(p&&!unlocked.has(p.cls)) issues.push([`${p.n} needs the ${p.cls} perk class unlocked.`]); });
  const droppedKinds=new Set(v.weapons.filter(w=>W[w.k]&&W[w.k].cat==="Dropped").map(w=>w.k)).size;
  const hasRareOrElec=[...v.weapons.map(w=>W[w.k]),...v.upgrades.map(u=>U[u.k])].some(d=>d&&(d.cat==="Rare"||(d.tags||[]).includes("Electrical")));
  return {v,st,base,rules,cost,slotsUsed,issues,unlocked,droppedKinds,hasRareOrElec,perks:v.perks,hasU:k=>v.upgrades.some(u=>u.k===k)};
}
function evalTeam(t){
  const spark=t.cars.some(c=>c.arch==="Spark");
  const cars=t.cars.map(v=>evalCar(v,{spark}));
  const total=cars.reduce((a,c)=>a+c.cost,0);
  const issues=[];
  if(total>t.budget) issues.push([`Team costs ${total} cans, ${total-t.budget} over the ${t.budget}-can limit.`]);
  // vehicle count, Mob
  let bikes=0, counted=0; cars.forEach(c=>{ if(c.v.type==="Bike"){ bikes++; if(bikes===1) return; } counted++; });
  const maxV=Math.floor(t.budget/20);
  if(counted>maxV) issues.push([`Standard rules allow ${maxV} vehicle${maxV===1?"":"s"} at ${t.budget} cans (one per full 20 cans${bikes?", first Bike free":""}); this team has ${counted}. Fine if your group agrees.`,"w"]);
  // rare vehicles (first bike exempt via Mob)
  const rareSeen={}; let bikeSeen=0;
  cars.forEach(c=>{ const b=VEHICLES[c.v.type]; if(!b[8]) return; if(c.v.type==="Bike"){ bikeSeen++; if(bikeSeen===1) return; } rareSeen[c.v.type]=(rareSeen[c.v.type]||0)+1; });
  Object.entries(rareSeen).forEach(([k,n])=>{ if(n>1) issues.push([`Only one ${k} allowed: it's a rare vehicle type.`]); });
  // archetypes unique
  const archSeen={}; t.cars.forEach(v=>{ if(v.arch){ archSeen[v.arch]=(archSeen[v.arch]||0)+1; } });
  Object.entries(archSeen).forEach(([k,n])=>{ if(n>1) issues.push([`Each driver archetype can only be used once: ${k} appears ${n} times.`]); });
  // rare weapons / upgrades once per team
  const rw={}; t.cars.forEach(v=>{ v.weapons.forEach(w=>{ if(W[w.k]&&W[w.k].cat==="Rare") rw[w.k]=(rw[w.k]||0)+1; }); v.upgrades.forEach(u=>{ if(U[u.k]&&U[u.k].cat==="Rare") rw[u.k]=(rw[u.k]||0)+1; }); });
  Object.entries(rw).forEach(([k,n])=>{ if(n>1) issues.push([`${k} is rare: one per team.`]); });
  const ctx={cars,
    fireCount: t.cars.reduce((a,v)=>a+v.perks.filter(p=>PERK_BY_ID[p]&&PERK_BY_ID[p].cls==="Pyromania").length+v.weapons.filter(w=>W[w.k]&&W[w.k].tags.includes("Fire")).length,0),
    upgradeCount: t.cars.reduce((a,v)=>a+v.upgrades.length,0),
    shootCount: t.cars.reduce((a,v)=>a+v.weapons.filter(w=>W[w.k]&&SHOOTING_CATS.includes(W[w.k].cat)&&w.k!=="Handgun").length,0),
    crewSum: cars.reduce((a,c)=>a+c.st.cr,0), weightSum: cars.reduce((a,c)=>a+c.st.wt,0)};
  const elig={}; SPONSORS.forEach(s=>elig[s[0]]=!!s[4](ctx));
  if(t.sponsor && !elig[t.sponsor]) issues.push([`Team doesn't meet ${t.sponsor}'s requirement yet.`,"w"]);
  return {cars,total,issues,maxV,counted,elig,ctx};
}

      const tw=d.turret?v.weapons.find(w=>w.id===u.target):null;

function wizSteps(){
  const s=[{k:"setup",t:"Team setup"}];
  for(let i=0;i<wiz.n;i++){ const c=`Car ${i+1}`; s.push({k:"veh",i,t:`${c} · Vehicle`},{k:"drv",i,t:`${c} · Driver`},{k:"wpn",i,t:`${c} · Weapons`},{k:"upg",i,t:`${c} · Upgrades`},{k:"prk",i,t:`${c} · Perks`}); }
  s.push({k:"sponsor",t:"Sponsor"},{k:"review",t:"Review"});
  return s;
}
function addRows(v,c,isW){
  const spark=team.cars.some(o=>o.arch==="Spark"); const elecOK=v.type==="Van"||spark;
  const slotsLeft=c.st.sl-c.slotsUsed; const airborne=c.rules.includes("Airborne");
  const groups= isW? [["Common","Common weapons"],["Hand","Hand weapons · carried by the crew, 360°, no slots"],["Dropped","Dropped weapons · out the back, no slots"],["Rare","Rare weapons · one per team"]]
                   : [["Common","Common upgrades · once per car"],["Rare","Rare upgrades · one per team"]];
  const pool= isW? Object.values(W): Object.values(U);
  return groups.map(([cat,label])=>`<div class="addgroup"><span class="lbl">${esc(label)}</span>${pool.filter(d=>d.cat===cat).map(d=>{
      let why="";
      if(isW){
        if(d.cat==="Rare" && team.cars.some(o=>o.weapons.some(w=>w.k===d.n))) why="Already on your team";
        else if(d.cat==="Dropped" && v.weapons.some(w=>w.k===d.n)) why="Already on this car";
      } else {
        if(d.cat==="Common" && v.upgrades.some(u=>u.k===d.n)) why="Already on this car";
        else if(d.cat==="Rare" && team.cars.some(o=>o.upgrades.some(u=>u.k===d.n))) why="Already on your team";
        else if(d.trailer && airborne) why="Airborne vehicles can't tow";
        else if(d.trailer && v.upgrades.some(u=>U[u.k]&&U[u.k].trailer)) why="One trailer per car";
        else if(d.trailer && c.st.wt<d.weightMin) why=`Needs Weight ${d.weightMin}+`;
      }
      if(!why && (d.tags||[]).includes("Electrical") && !elecOK) why="Needs a Spark driver on the team, or a Van";
      const need=isW?d.slots:(d.turret&&v.type==="Tank"?0:d.slots);
      const warn=!why && !d.trailer && need>slotsLeft ? `Needs ${need} slot${need===1?"":"s"}, ${Math.max(0,slotsLeft)} left` : "";
      const cost=d.turret?"2+X":d.cost;
      const slotTxt=d.trailer?`+${d.trailer} sl`:`${need} sl`;
      const detail= isW? `${d.range} · ${d.dice}${d.tags.length?" · "+tagLine(d):""}${d.note?" — "+d.note:""}` : `${d.tags.length?tagLine(d)+" — ":""}${d.note}`;
      return `<button class="addrow" data-act="${isW?"wizaddw":"wizaddu"}" data-car="${v.id}" data-k="${esc(d.n)}" ${why?"disabled":""}><span><b>${esc(d.n)}</b><small>${esc(detail)}</small></span><span class="ar-p">${cost} c · ${slotTxt}</span>${why?`<span class="ar-why">${esc(why)}</span>`:warn?`<span class="ar-why warn">${esc(warn)}</span>`:""}</button>`;
    }).join("")}</div>`).join("");
}
function buildSummary(T,steps,st){
  const left=team.budget-T.total;
  const stepOf=i=>steps.findIndex(x=>x.k==="veh"&&x.i===i);
  const li=(name,meta)=>`<li><span>${esc(name)}</span><span>${esc(meta)}</span></li>`;
  const row=(k,items)=>`<div class="sum-row"><span class="k">${k}</span>${items.length?`<ul>${items.join("")}</ul>`:`<span class="none">none yet</span>`}</div>`;
  const cars=[];
  for(let i=0;i<wiz.n;i++){
    const c=T.cars[i];
    if(!c){ cars.push(`<div class="sum-car ${st.i===i?"cur":""}"><div class="sum-h"><b>Car ${i+1}</b><span class="note">no vehicle yet</span></div></div>`); continue; }
    const v=c.v;
    const wpns=v.weapons.filter(w=>W[w.k]).map(w=>{ const d=W[w.k]; const turret=v.upgrades.some(u=>U[u.k]&&U[u.k].turret&&u.target===w.id); const dir=d.cat==="Dropped"?"rear":(d.tags.includes("360")||turret)?"360°":(w.f||"Front").toLowerCase(); return li(`${d.n} (${dir})`,`${d.dice} · ${d.cost} c`); });
    const upgs=v.upgrades.filter(u=>U[u.k]).map(u=>{ const d=U[u.k]; const tw=d.turret?v.weapons.find(w=>w.id===u.target):null; const price=d.turret?2+(tw?W[tw.k].cost:0):d.cost; return li(`${d.n}${u.f?` (${u.f.toLowerCase()})`:""}`,`${price} c`); });
    const perks=v.perks.filter(p=>PERK_BY_ID[p]).map(p=>li(PERK_BY_ID[p].n,`${PERK_BY_ID[p].cost} c`));
    const drv=v.arch?`${v.arch}${v.driver?` · ${v.driver}`:""}`:(v.driver||"");
    const nW=v.weapons.length, crew=c.st.cr;
    const flags=[];
    if(nW>crew) flags.push([`${nW} weapons but ${crew} crew: fires ${crew} per turn`,""]);
    if(c.slotsUsed>c.st.sl) flags.push([`${c.slotsUsed - c.st.sl} build slot${c.slotsUsed-c.st.sl===1?"":"s"} over`,"bad"]);
    c.issues.filter(x=>x[1]!=="w"&&!/build slots/.test(x[0])).forEach(x=>flags.push([x[0],"bad"]));
    cars.push(`<div class="sum-car ${st.i===i?"cur":""}">
      <div class="sum-h"><b>${i+1}. ${esc(v.type)}</b><span>${c.cost} c</span></div>
      <div class="sum-stats">Gear ${c.st.mg} · Hand ${c.st.hd} · Crew ${crew} · Wt ${c.st.wt} · Arm ${c.st.ar} · Hull ${c.st.hl} · Slots ${c.slotsUsed}/${c.st.sl}</div>
      <div class="sum-row"><span class="k">Driver</span>${drv?`<span>${esc(drv)}</span>`:`<span class="none">none yet</span>`}</div>
      ${row("Weapons",wpns)}${row("Upgrades",upgs)}${row("Perks",perks)}
      ${flags.map(f=>`<div class="sum-flag ${f[1]}">${esc(f[0])}</div>`).join("")}
      ${st.k!=="setup"&&st.i!==i?`<div><button class="sum-edit" data-act="wizjump" data-step="${stepOf(i)}">Edit car ${i+1}</button></div>`:""}
    </div>`);
  }
  return `<div class="sum">
    <div class="sum-top"><span><b>${T.total}</b> / ${team.budget} cans</span><span class="${left<0?"neg":""}" style="color:${left<0?"var(--bad)":"var(--muted)"}">${left<0?`${-left} over`:`${left} left`}</span></div>
    ${cars.join("")}
    ${team.sponsor?`<div class="sum-row"><span class="k">Sponsor</span><span>${esc(team.sponsor)}${T.elig[team.sponsor]?"":" (not met yet)"}</span></div>`:""}
  </div>`;
}

      </div>`;
  } else if(st.k==="wpn"||st.k==="upg"){
    const isW=st.k==="wpn"; const slotsLeft=c.st.sl-c.slotsUsed;
    body=`<h2 class="wiz-q">Car ${st.i+1}: ${isW?"arm the":"upgrade the"} ${esc(v.type)}</h2>

function ammoItems(v){
  const extra=v.perks.includes("Fireworks#5")?1:0;
  const out=[];
  v.weapons.forEach((w,wi)=>{ const d=W[w.k]; if(!d) return; const t=d.tags.find(x=>x.startsWith("Ammo")); if(t) out.push({key:"w"+wi,name:d.n,n:parseInt(t.split(" ")[1],10)+extra}); });
  v.upgrades.forEach((u,ui)=>{ const d=U[u.k]; if(!d) return; const t=(d.tags||[]).find(x=>x.startsWith("Ammo")); if(t) out.push({key:"u"+ui,name:d.n,n:parseInt(t.split(" ")[1],10)+extra}); });
  return out;
}
function renderPlay(){
  const T=evalTeam(team);
  if(!T.cars.length) return `<section class="play"><div class="hero"><h2 class="hero-h">No cars yet</h2><p class="hero-p">Build a team first, then come back here to track it during the game.</p><div class="hero-actions"><button class="btn primary big" data-act="startwiz">Start a new build</button></div></div></section>`;
  const sp = team.sponsor && T.elig[team.sponsor] ? SPONSORS.find(x=>x[0]===team.sponsor) : null;
  const cars=T.cars.map((c,i)=>{
    const v=c.v, p=ps(i), max=c.st.hl, left=Math.max(0,max-p.dmg);
    if(p.gear>c.st.mg) p.gear=c.st.mg;
    let hand=c.st.hd; const why=[];
    if(v.perks.includes("Speed#4")){ if(p.gear===5){hand+=1;why.push("Kiss My Asphalt +1");} if(p.gear>=6){hand+=2;why.push("Kiss My Asphalt +2");} }
    if(v.perks.includes("Daring#4") && left<max/2){ hand+=1; why.push("Lock In +1"); }
    if(sp && sp[0]==="Chivo" && p.hz===0){ hand+=1; why.push("Lowrider +1"); }
    const ammo=ammoItems(v);
    const wList=v.weapons.filter(w=>W[w.k]).map(w=>{ const d=W[w.k]; const turret=v.upgrades.some(u=>U[u.k]&&U[u.k].turret&&u.target===w.id); const dir=d.cat==="Dropped"?"rear":(d.tags.includes("360")||turret)?"360°":(w.f||"Front").toLowerCase(); return `<div><b>${esc(d.n)}</b> · ${esc(dir)} · ${esc(d.range)} · ${esc(d.dice)}${d.tags.length?" · "+esc(tagLine(d)):""}${d.note?` — ${esc(d.note)}`:""}</div>`; }).join("");
    const pList=v.perks.filter(x=>PERK_BY_ID[x]).map(x=>`<div><b>${esc(PERK_BY_ID[x].n)}:</b> ${esc(PERK_BY_ID[x].note)}</div>`).join("");
    const uList=v.upgrades.filter(u=>U[u.k]).map(u=>`<div><b>${esc(U[u.k].n)}${u.f?` (${esc(u.f.toLowerCase())})`:""}:</b> ${esc(U[u.k].note)}</div>`).join("");
    return `<article class="dash ${left===0?"wrecked":""}">
      <div class="dash-h"><b>${i+1}. ${esc(v.type)}</b><span class="note">${v.arch?esc(v.arch):"No archetype"}${v.driver?` · ${esc(v.driver)}`:""}</span>${left===0?`<span class="status-pill no">Wrecked</span>`:""}</div>

      <div class="dash-sec"><span class="lbl">Gear (max ${c.st.mg})</span>
        <div class="gears">${[1,2,3,4,5,6].map(g=>`<button class="gbtn ${g===p.gear?"on":""}" data-act="pgear" data-i="${i}" data-g="${g}" ${g>c.st.mg?"disabled":""} aria-pressed="${g===p.gear}" aria-label="Gear ${g}">${g}</button>`).join("")}</div></div>

      <div class="dash-row">
        <div class="dash-sec"><span class="lbl">Hazards</span>
          <div class="hz ${p.hz>=6?"hi":p.hz>=3?"mid":""}"><button class="cbtn" data-act="phz" data-i="${i}" data-d="-1" aria-label="Remove a hazard">−</button><b aria-live="polite">${p.hz}</b><button class="cbtn" data-act="phz" data-i="${i}" data-d="1" aria-label="Add a hazard">+</button></div></div>
        <div class="dash-sec"><span class="lbl">Handling dice</span><span class="hand"><b>${hand}</b>${why.length?esc(why.join(", ")):"base"}</span></div>
      </div>

      <div class="dash-sec"><div class="dash-row"><span class="lbl">Hull · ${left} of ${max} left</span><span class="note">Tap a box to mark damage</span></div>
        <div class="hullgrid">${Array.from({length:max},(_,k)=>`<button class="hb ${k<p.dmg?"hit":""}" data-act="phull" data-i="${i}" data-k="${k}" aria-label="Hull box ${k+1}${k<p.dmg?", damaged":""}">${k+1}</button>`).join("")}</div></div>

      ${ammo.length?`<div class="dash-sec"><span class="lbl">Ammo</span>${ammo.map(a=>{ const used=(p.ammo[a.key]||0); return `<div class="ammo-row"><span>${esc(a.name)}</span><span class="ammo-boxes">${Array.from({length:a.n},(_,k)=>`<button class="ab ${k<used?"used":""}" data-act="pammo" data-i="${i}" data-key="${a.key}" data-k="${k}" aria-label="${esc(a.name)} ammo ${k+1}${k<used?", used":""}">${k<used?"✕":""}</button>`).join("")}</span></div>`; }).join("")}</div>`:""}

      <div class="dash-row"><button class="firebtn ${p.fire?"on":""}" data-act="pfire" data-i="${i}" aria-pressed="${p.fire}">${p.fire?"On Fire":"Not on fire"}</button>
        <span class="note">Crew ${c.st.cr} · Armour ${c.st.ar} · Weight ${c.st.wt}</span></div>
      ${p.fire?`<p class="note">On Fire: 1 damage at the start of each activation, then roll a die. Beat your hazard count (${p.hz}) to put it out.</p>`:""}

      <details class="refbox"><summary>Quick reference</summary><div class="ref" style="margin-top:6px">
        ${v.arch?`<div><b>${esc(v.arch)}:</b> ${esc(ARCH[v.arch][1])}</div>`:""}
        ${wList}${uList}${pList}
        ${sp?`<div><b>${esc(sp[2])} (${esc(sp[0])}):</b> ${esc(sp[3])}</div>`:""}
        ${c.rules.map(r=>`<div><b>${esc(r)}:</b> ${esc(VEHICLE_RULES[r]||"")}</div>`).join("")}
      </div></details>
    </article>`;
  }).join("");
  return `<section class="play">
    <div class="play-top">
      <div><span class="lbl">${esc(team.name)}</span><div class="counter"><span class="lbl" style="margin-right:4px">Round</span><button class="cbtn" data-act="pround" data-d="-1" aria-label="Previous round">−</button><b>${play.round}</b><button class="cbtn" data-act="pround" data-d="1" aria-label="Next round">+</button></div></div>
      ${play.confirmReset?`<div class="tools"><span class="note">Reset all cars to full hull, gear 1, no hazards?</span><button class="btn small danger" data-act="presetok">Reset</button><button class="btn small" data-act="presetno">Keep</button></div>`:`<button class="btn small" data-act="preset">New game</button>`}
    </div>
    <div class="play-cars">${cars}</div>
  </section>`;
}

function render(){
  $("#play").hidden=view!=="play"; $("#play").innerHTML= view==="play"? renderPlay():"";
  $("#home").hidden=view!=="home"; $("#wiz").hidden=view!=="wiz"; $("#builder").hidden=view!=="builder";
  $("#home").innerHTML= view==="home"? renderHome():"";
  $("#wiz").innerHTML= view==="wiz"? renderWizard():"";
  if(view==="builder") renderBuilder(); else { $("#board").innerHTML=""; $("#cars").innerHTML=""; $("#aside").innerHTML=""; }
  $("#nav").innerHTML=`<button class="btn small" data-act="gohome" ${view==="home"?'aria-current="page"':""}>Home</button><button class="btn small" data-act="startwiz" ${view==="wiz"?'aria-current="page"':""}>Guided build</button><button class="btn small" data-act="gobuilder" ${view==="builder"?'aria-current="page"':""}>Builder</button><button class="btn small" data-act="goplay" ${view==="play"?'aria-current="page"':""}>Play</button>`;
  persist();
}
document.addEventListener("toggle",e=>{ if(e.target&&e.target.dataset&&e.target.dataset.sum) wiz.sumOpen=e.target.open; },true);
function toTop(){ try{ window.scrollTo(0,0); }catch(e){} }
function beginWizard(){
  const b=team.example?50:team.budget, cb=team.example?false:!!team.customBudget;
  team=blankTeam(); team.budget=b; team.customBudget=cb;
  wiz={step:0,n:stdCars(b),nTouched:false,confirm:false}; view="wiz"; toTop();
}
function stripTeam(t){ return {name:t.name,budget:t.budget,customBudget:!!t.customBudget,sponsor:t.sponsor,cars:t.cars.map(c=>({type:c.type,arch:c.arch,named:c.named,driver:c.driver,second:c.second,perks:c.perks,weapons:c.weapons.map(w=>({k:w.k,f:w.f,id:w.id})),upgrades:c.upgrades.map(u=>({k:u.k,f:u.f,target:u.target,id:u.id}))}))}; }
function persist(){ lsSet(LS_CUR,team); try{ history.replaceState(null,"","#t="+encodeURIComponent(encodeTeam(stripTeam(team)))); }catch(e){} }
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,1800); }

/* ============================== EVENTS ============================== */
const carById=id=>team.cars.find(c=>c.id===id);
function pruneCar(v){ // drop perks from classes no longer unlocked
  const un=new Set(); if(v.arch) un.add(ARCH[v.arch][0]); if(v.named&&v.second) un.add(v.second);
  v.perks=v.perks.filter(p=>PERK_BY_ID[p]&&un.has(PERK_BY_ID[p].cls));
  v.upgrades.forEach(u=>{ if(U[u.k]&&U[u.k].turret&&!v.weapons.some(w=>w.id===u.target)) u.target=""; });
}
function touch(){ team.example=false; }
document.addEventListener("change",e=>{
  const el=e.target, a=el.dataset.act; if(!a) return; const v=el.dataset.car?carById(el.dataset.car):null;
  switch(a){
    case "budget": if(el.value==="custom"){ team.customBudget=true; } else { team.budget=+el.value; team.customBudget=false; } if(view==="wiz"&&!wiz.nTouched) wiz.n=stdCars(team.budget); break;
    case "budgetc": { const n=parseInt(el.value,10); if(n>=1&&n<=999){ team.budget=n; team.customBudget=true; } } if(view==="wiz"&&!wiz.nTouched) wiz.n=stdCars(team.budget); break;
    case "wizn": wiz.n=+el.value; wiz.nTouched=true; break;
    case "type": v.type=el.value; break;
    case "arch": v.arch=el.value; if(v.second===(v.arch&&ARCH[v.arch][0])) v.second=""; pruneCar(v); break;
    case "second": v.second=el.value; pruneCar(v); break;
    case "driver": v.driver=el.value.trim(); v.named=!!v.driver; if(!v.named) v.second=""; pruneCar(v); break;
    case "tname": team.name=el.value.trim()||"Untitled team"; break;
    case "perk": if(el.checked){ if(!v.perks.includes(el.dataset.perk)) v.perks.push(el.dataset.perk); } else v.perks=v.perks.filter(p=>p!==el.dataset.perk); break;
    case "wadd": if(el.value){ const d=W[el.value]; v.weapons.push({id:nid(),k:el.value,f:d.cat==="Dropped"||d.tags.includes("360")?undefined:"Front"}); } break;
    case "uadd": if(el.value){ const d=U[el.value]; v.upgrades.push({id:nid(),k:el.value,f:d.facing?"Front":undefined,target:""}); } break;
    case "wface": { const w=v.weapons.find(x=>x.id===el.dataset.item); w.f=el.value; } break;
    case "uface": { const u=v.upgrades.find(x=>x.id===el.dataset.item); u.f=el.value; } break;
    case "utarget": { const u=v.upgrades.find(x=>x.id===el.dataset.item); u.target=el.value; } break;
    case "addcar": if(el.value){ team.cars.push({id:nid(),type:el.value,arch:"",named:false,driver:"",second:"",perks:[],weapons:[],upgrades:[]}); } break;
    case "sponsor": team.sponsor=el.value; break;
    default: return;
  }
  touch(); render();
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||el.tagName==="SELECT"||el.tagName==="INPUT") return;
  const a=el.dataset.act, v=el.dataset.car?carById(el.dataset.car):null;
  switch(a){
    case "wdel": v.weapons=v.weapons.filter(w=>w.id!==el.dataset.item); pruneCar(v); break;
    case "udel": v.upgrades=v.upgrades.filter(u=>u.id!==el.dataset.item); break;
    case "del": team.cars=team.cars.filter(c=>c!==v); break;
    case "dup": { const c=JSON.parse(JSON.stringify(v)); c.id=nid(); c.arch=""; c.named=false; c.driver=""; c.second=""; c.perks=[]; c.weapons.forEach(w=>w.id=nid()); const map={}; v.weapons.forEach((w,i)=>map[w.id]=c.weapons[i].id); c.upgrades.forEach(u=>{u.id=nid(); if(u.target) u.target=map[u.target]||"";}); team.cars.push(c); toast("Vehicle duplicated (driver left blank)"); } break;
    case "save": { const saves=lsGet(LS_SAVES)||[]; const T=evalTeam(team); const entry={name:team.name,total:T.total,team:stripTeam(team)}; const i=saves.findIndex(s=>s.name===team.name); if(i>=0) saves[i]=entry; else saves.unshift(entry); lsSet(LS_SAVES,saves); confirmDel=null; toast("Saved to this browser"); } break;
    case "sload": { const s=(lsGet(LS_SAVES)||[])[+el.dataset.i]; if(s){ team=hydrate(s.team); view="builder"; toast("Loaded "+s.name); } } break;
    case "sdel": confirmDel=+el.dataset.i; render(); return;
    case "sdelno": confirmDel=null; render(); return;
    case "sdelok": { const saves=lsGet(LS_SAVES)||[]; saves.splice(+el.dataset.i,1); lsSet(LS_SAVES,saves); confirmDel=null; toast("Deleted"); } break;
    case "new": team=blankTeam(); break;
    case "example": team=exampleTeam(); break;
    case "copy": { const code=$("#code").value; const done=()=>toast("Code copied"); try{ navigator.clipboard.writeText(code).then(done,()=>{ $("#code").select(); toast("Select-all done: copy it manually"); }); }catch(err){ $("#code").select(); toast("Select-all done: copy it manually"); } } return;
    case "goplay": view="play"; toTop(); render(); return;
    case "pround": play.round=Math.max(1,play.round+(+el.dataset.d)); savePlay(); render(); return;
    case "preset": play.confirmReset=true; render(); return;
    case "presetno": play.confirmReset=false; render(); return;
    case "presetok": play={round:1,cars:[],sig:teamSig()}; savePlay(); toast("New game: all cars reset"); render(); return;
    case "pgear": { const q=ps(+el.dataset.i); q.gear=+el.dataset.g; savePlay(); render(); } return;
    case "phz": { const q=ps(+el.dataset.i); q.hz=Math.max(0,Math.min(20,q.hz+(+el.dataset.d))); savePlay(); render(); } return;
    case "phull": { const q=ps(+el.dataset.i), k=+el.dataset.k; q.dmg = (k===q.dmg-1) ? k : k+1; savePlay(); render(); } return;
    case "pammo": { const q=ps(+el.dataset.i), k=+el.dataset.k, key=el.dataset.key; const u=q.ammo[key]||0; q.ammo[key] = (k===u-1) ? k : k+1; savePlay(); render(); } return;
    case "pfire": { const q=ps(+el.dataset.i); q.fire=!q.fire; savePlay(); render(); } return;
    case "gohome": view="home"; wiz.confirm=false; toTop(); render(); return;
    case "gobuilder": view="builder"; toTop(); render(); return;
    case "startwiz": if(team.cars.length && !team.example){ view="home"; wiz.confirm=true; toTop(); render(); return; } beginWizard(); render(); return;
    case "startwizok": beginWizard(); render(); return;
    case "startwizno": wiz.confirm=false; render(); return;
    case "startwizsave": { const saves=lsGet(LS_SAVES)||[]; const T=evalTeam(team); const entry={name:team.name,total:T.total,team:stripTeam(team)}; const i=saves.findIndex(s=>s.name===team.name); if(i>=0) saves[i]=entry; else saves.unshift(entry); lsSet(LS_SAVES,saves); toast("Saved "+team.name); beginWizard(); render(); } return;
    case "wizback": wiz.step--; toTop(); render(); return;
    case "wiznext": { const st=wizSteps()[wiz.step]; if(st&&st.k==="setup") team.cars=team.cars.slice(0,wiz.n); wiz.step++; toTop(); render(); } return;
    case "wizjump": wiz.step=+el.dataset.step; toTop(); render(); return;
    case "wizveh": { const i=+el.dataset.i; if(team.cars[i]){ team.cars[i].type=el.dataset.type; } else { team.cars.push({id:nid(),type:el.dataset.type,arch:"",named:false,driver:"",second:"",perks:[],weapons:[],upgrades:[]}); } } break;
    case "wizarch": v.arch=el.dataset.arch; if(v.arch&&v.second===ARCH[v.arch][0]) v.second=""; pruneCar(v); break;
    case "wizaddw": { const d=W[el.dataset.k]; v.weapons.push({id:nid(),k:d.n,f:d.cat==="Dropped"||d.tags.includes("360")?undefined:"Front"}); } break;
    case "wizaddu": { const d=U[el.dataset.k]; v.upgrades.push({id:nid(),k:d.n,f:d.facing?"Front":undefined,target:""}); } break;
    case "copylink": { const url=location.href; const done=()=>toast("Link copied"); try{ navigator.clipboard.writeText(url).then(done,()=>{ $("#code").select(); toast("Couldn't copy the link; copy the code instead"); }); }catch(err){ toast("Couldn't copy the link; copy the code instead"); } } return;
    case "import": { try{ team=hydrate(decodeTeam($("#paste").value)); toast("Team loaded"); }catch(err){ toast("That code didn't load. Check you pasted all of it."); return; } } break;
    default: return;
  }
  if(a!=="example"&&a!=="new"&&a!=="sload"&&a!=="import") touch();
  render();
});
function hydrate(t){ t.cars=(t.cars||[]).filter(c=>VEHICLES[c.type]); t.cars.forEach(c=>{ c.id=nid(); c.perks=(c.perks||[]).filter(p=>PERK_BY_ID[p]); c.weapons=(c.weapons||[]).filter(w=>W[w.k]); c.upgrades=(c.upgrades||[]).filter(u=>U[u.k]); c.weapons.forEach(w=>w.id=w.id||nid()); c.upgrades.forEach(u=>u.id=u.id||nid()); }); t.budget=+t.budget||50; t.sponsor=t.sponsor||""; return t; }
team=hydrate(team);
render();
</script>
